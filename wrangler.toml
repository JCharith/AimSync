name = "aimsync"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "aimsync-db"
database_id = "4c10d76d-d19f-4372-925a-565ad2d31912"

[vars]
GITHUB_REPO_OWNER = "LogicArchitectDS"
GITHUB_REPO_NAME = "AimSync"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1